[package]
name = "agent-limits"
version = "2026.7.2"
edition = "2021"
description = "Vendored OpenCode Go usage provider (port of f4ah6o/agent-limits, MIT)"
license = "MIT"
repository = "https://github.com/f4ah6o/agent-limits"
publish = false

[lib]
name = "agent_limits"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "=0.12.28", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde_json = "1"
