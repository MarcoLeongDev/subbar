[package]
name = "subbar"
version = "1.0.8"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.3", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
reqwest = { version = "=0.12.28", features = ["json", "rustls-tls"], default-features = false }
tauri-plugin-liquid-glass = "=0.1.6"
log = "=0.4.33"
env_logger = "=0.11.11"
keyring = { version = "=3.6.3", default-features = false }
tokio = { version = "=1.52.3", features = ["time", "rt", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
objc = "=0.2.7"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }


